# nginx for OPTZ. Installed by ops/install-prod.sh as /etc/nginx/sites-available/optz.
#   /api/*     -> the Rust API (127.0.0.1:3000), never touching Bun
#   /assets/*  -> straight from disk: hashed, immutable, pre-compressed (.gz)
#   everything else -> the optz site on Bun (127.0.0.1:3001), which runs the app's middleware
upstream optz_api {
    server 127.0.0.1:3000;
    keepalive 64;
}
upstream optz_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://optz_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    location /assets/ {
        alias /opt/optz/current/web/apps/site/dist/static/assets/;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        proxy_pass http://optz_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
