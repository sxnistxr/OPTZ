# nginx site for OPTZ: the static frontend on :80, the API under /api.
# Installed by ops/install-prod.sh as /etc/nginx/sites-available/optz.
upstream optz_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/optz/current/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # /api/feed -> http://127.0.0.1:3000/feed
    location /api/ {
        proxy_pass http://optz_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # Built CSS/JS keep their names across deploys, so revalidate rather than cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
