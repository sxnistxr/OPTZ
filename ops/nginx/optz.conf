# Generated by `optz nginx` from optz.config.ts.
proxy_cache_path /var/cache/nginx/optz levels=1:2 keys_zone=optz_micro:8m max_size=64m inactive=10m use_temp_path=off;
upstream optz_app {
    server 127.0.0.1:3001;
    keepalive 32;
}
upstream optz_api_social {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;

    location /api/social/ {
        proxy_pass http://optz_api_social/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        # Micro-cache GETs: at most one request per 1s per URL reaches the upstream.
        proxy_cache optz_micro;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        add_header X-Cache $upstream_cache_status always;
    }

    location /assets/ {
        alias /opt/optz/current/web/portfolio/dist/static/assets/;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        proxy_pass http://optz_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
}
