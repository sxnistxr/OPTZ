[package]
name = "twelve-iouring"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
io-uring = "=0.7.15"
libc = "=0.2.191"
httparse = "=1.10.1"
sha2 = "=0.11.1"
hmac = "=0.13.0"

[dev-dependencies]
serde_json = "=1.0.154"

[build-dependencies]
cc = "=1.10.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev]
panic = "abort"
